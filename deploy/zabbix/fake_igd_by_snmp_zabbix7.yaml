zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: a571c0d144b14fd4a87a9d9b2aa9fcd6
    name: Templates/Applications
  templates:
  - uuid: 818d741dc93c4a1e9ca02667a3bd32e4
    template: fake-igd by SNMP
    name: fake-igd by SNMP
    description: 'fake-igd, a fake UPnP router (IGD) that opens no port: its SNMPv3 agent (Settings - Monitoring - SNMPv3).


      The host: an SNMP interface at the machine''s address, port 161, SNMPv3, authPriv, the user and both passphrases of
      the page; link this template. MIB: FAKE-IGD-MIB (deploy/FAKE-IGD-MIB.txt in the package).


      Made by fake-igd 1.7.4.'
    vendor:
      name: fake-igd
      version: 7.0-1.7.4
    groups:
    - name: Templates/Applications
    items:
    - uuid: d7a76e8049ab457e91c69df6bda83b07
      name: 'Requests by action: the table'
      type: SNMP_AGENT
      snmp_oid: walk[1.3.6.1.4.1.8072.9999.9999.8.3.20.1.2,1.3.6.1.4.1.8072.9999.9999.8.3.20.1.3]
      key: fakeigd.action.walk
      delay: 5m
      history: '0'
      value_type: TEXT
      trends: '0'
      description: The table, read whole; the items of the discovery below take it apart.
      tags:
      - tag: component
        value: requests
    - uuid: dde4bde32a1c402c869a5bcf511b622e
