    - uuid: 78a192585f0348119719d7e02e6a4cc7
      name: Uptime (the pages' API)
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.8072.9999.9999.8.1.4.0]
      key: fakeigd.api.uptime
      value_type: FLOAT
      units: uptime
      description: 'Since the pages'' API (which answers SNMP) started.

        OID: 1.3.6.1.4.1.8072.9999.9999.8.1.4.0 (FAKE-IGD-MIB)'
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
      triggers:
      - uuid: c73088d004604bada00d1485ebdfcbff
        expression: last(/fake-igd by SNMP/fakeigd.api.uptime)<10m
        name: 'fake-igd: The pages'' API has been restarted'
        priority: INFO
        opdata: 'Current: {ITEM.LASTVALUE1}'
        description: Uptime is less than 10 minutes.
        tags:
        - tag: scope
          value: notice
