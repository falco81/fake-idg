      name: Problems fake-igd sees
      type: DEPENDENT
      key: fakeigd.alert.discovery
      delay: '0'
      description: Each thing fake-igd sees wrong now - a problem of its own while it lasts, gone when it is right.
      master_item:
        key: fakeigd.alert.walk
      lifetime_type: DELETE_IMMEDIATELY
      preprocessing:
      - type: SNMP_WALK_TO_JSON
        parameters:
        - '{#SNMPVALUE}'
        - 1.3.6.1.4.1.8072.9999.9999.8.5.3.1.2
        - '0'
        - '{#KEY}'
        - 1.3.6.1.4.1.8072.9999.9999.8.5.3.1.2
        - '0'
        - '{#LEVEL}'
        - 1.3.6.1.4.1.8072.9999.9999.8.5.3.1.3
        - '0'
        - '{#TITLE}'
        - 1.3.6.1.4.1.8072.9999.9999.8.5.3.1.4
        - '0'
        error_handler: DISCARD_VALUE
      item_prototypes:
      - uuid: 479ddfa387744a34857eb555265be8ab
        name: 'Problem [{#KEY}]: level'
        type: DEPENDENT
        key: fakeigd.alert.level[{#KEY}]
        delay: '0'
        value_type: CHAR
        trends: '0'
        description: 'OID: 1.3.6.1.4.1.8072.9999.9999.8.5.3.1.3.{#SNMPINDEX} (FAKE-IGD-MIB)'
        preprocessing:
        - type: SNMP_WALK_VALUE
