          name: 'fake-igd: {#TITLE}'
          priority: HIGH
          description: 'fake-igd sees it (Settings - Alerts): {#KEY}.'
          tags:
          - tag: scope
            value: notice
        - uuid: 271aee1a2cd94232a2bcf923adca09f1
