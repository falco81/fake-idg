        priority: WARNING
        opdata: '{ITEM.LASTVALUE1} left'
        dependencies:
        - name: 'fake-igd: The certificate of the pages ends within {$FAKEIGD.CERT.EXPIRY.CRIT} days'
          expression: last(/fake-igd by SNMP/fakeigd.cert.days)<{$FAKEIGD.CERT.EXPIRY.CRIT}
        tags:
        - tag: scope
          value: notice
