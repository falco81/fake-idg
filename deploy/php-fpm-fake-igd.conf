; /etc/php-fpm.d/fake-igd.conf
;
; A pool of fake-igd's own (as otp's), so that its pages run as an account that
; may read the API token and nothing else - not as whatever every other PHP site
; on the machine runs as. install.sh writes the socket's owner for this machine.
[fake-igd]
user = fake-igd-www
group = fake-igd-www
listen = /run/php-fpm/fake-igd.sock
listen.owner = nginx
listen.group = nginx
listen.mode = 0660
pm = ondemand
pm.max_children = 12
pm.process_idle_timeout = 30s
pm.max_requests = 500
; Nothing on the pages is ever a form: every request is JSON, read from php://input.
; PHP never takes a body apart here (php2shell), and upload progress is off.
php_admin_flag[enable_post_data_reading] = off
php_admin_value[session.upload_progress.enabled] = 0
php_admin_value[session.use_strict_mode] = 1
php_admin_value[post_max_size] = 96M
php_admin_value[upload_max_filesize] = 1M
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 360
php_admin_flag[allow_url_fopen] = off
php_admin_value[open_basedir] = /var/www/fake-igd:/run/fake-igd-api:/tmp
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,mail,mb_send_mail,putenv,dl,error_log,imap_open
php_admin_flag[expose_php] = off
php_admin_flag[display_errors] = off
php_admin_flag[display_startup_errors] = off
php_admin_flag[log_errors] = on
php_admin_flag[html_errors] = off
