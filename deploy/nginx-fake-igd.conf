# /etc/nginx/conf.d/fake-igd.conf
#
# fake-igd's pages, over TLS - otp's otp.conf for fake-igd:
#
#   https://fake-igd.example.local/admin/   the pages (/ sends there)
#
# They are PHP that only relays to fake-igd-api on 127.0.0.1:9862, run in a
# php-fpm pool of fake-igd's own. Everything else here is a file (the style,
# the scripts) or refused.
#
# Who may reach them: the allow list between ADMIN-ALLOW-BEGIN and
# ADMIN-ALLOW-END - written by install.sh from --admin-allow and by root's
# helper from the setting web_allow (Settings → Pages and firewall).

# Signing in is limited per address: a wrong password costs time. The whole
# query string is looked at, not $arg_api (as otp's).
map $args $igd_login_key {
    "~(^|&)api=login(&|$)"   $binary_remote_addr;
    default                  "";
}
limit_req_zone $igd_login_key zone=igd_login:1m rate=20r/m;
limit_req_zone $binary_remote_addr zone=igd_all:10m rate=10r/s;

server {
    listen      80;
    server_name fake-igd.example.local;       # <- your hostname
    server_tokens off;
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen      443 ssl http2;
    server_name fake-igd.example.local;       # <- your hostname

    root  /var/www/fake-igd;
    index index.php;
    server_tokens off;

    access_log /var/log/nginx/fake-igd-access.log;
    error_log  /var/log/nginx/fake-igd-error.log;

    ssl_certificate           /etc/nginx/certs/fake-igd.pem;
    ssl_certificate_key       /etc/nginx/certs/fake-igd.key;
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:IGD:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "no-referrer" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    # No Content-Security-Policy here: the page sends its own, with a nonce made
    # for each page (as otp's).

    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    client_max_body_size 1m;
    client_body_timeout  60s;

    if ($request_method !~ ^(GET|HEAD|POST)$) { return 405; }
    # php2shell (CVE-2026-109618, CVE-2026-109619): nothing on the pages sends a
    # multipart body, and PHP takes one apart before any page runs.
    if ($http_content_type ~* "multipart") { return 403; }

    location = / { return 301 /admin/; }

    # ---- the pages -----------------------------------------------------------
    location = /admin { return 301 /admin/; }
    location = /admin/ {
        # ADMIN-ALLOW-BEGIN
        allow 192.168.0.0/16;         # <- your own networks
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        # ADMIN-ALLOW-END
        allow 127.0.0.1;
        allow ::1;
        deny  all;
        limit_req zone=igd_login burst=10 nodelay;
        limit_req zone=igd_all   burst=60 nodelay;
        limit_req_status 429;
        fastcgi_pass   unix:/run/php-fpm/fake-igd.sock;
        fastcgi_param  SCRIPT_FILENAME $document_root/admin/index.php;
        fastcgi_param  HTTPS on;
        include        fastcgi_params;
        # A new version sent from the pages is a package of a few hundred kB as JSON.
        client_max_body_size 96m;
        fastcgi_request_buffering on;
        fastcgi_read_timeout 360s;
    }

    # ---- is it answering? (as otp's /healthz) ----------------------------------
    location = /healthz {
        limit_req zone=igd_all burst=10 nodelay;
        limit_req_status 429;
        fastcgi_pass   unix:/run/php-fpm/fake-igd.sock;
        fastcgi_param  SCRIPT_FILENAME $document_root/healthz.php;
        fastcgi_param  HTTPS on;
        include        fastcgi_params;
        fastcgi_read_timeout 10s;
        access_log off;
    }

    # ---- files ------------------------------------------------------------------
    location /assets/ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }
    location = /favicon.ico { return 301 /assets/favicon.svg; }

    # Nothing else: no other PHP file answers when asked by name, no dot file.
    location ~ \.php$ { return 404; }
    location ~ /\.    { deny all; }
    location /        { return 404; }
}
