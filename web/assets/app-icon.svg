<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- fake-igd on a home screen (1.9.8): the favicon's shield and router, full-bleed - iPadOS and Android round
       the corners themselves; the shield inside the safe zone of a maskable icon. -->
